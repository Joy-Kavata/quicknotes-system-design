<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes App</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>QuickNotes</h1>
        
        <p id="status" class="status-message" aria-live="polite"></p>

        <section class="form-section">
            <h2>Create a New Note</h2>
            <form id="note-form">
                <div class="input-group">
                    <label for="title-input">Title (Required, max 100 chars):</label>
                    <input type="text" id="title-input" maxlength="100" required placeholder="Enter note title...">
                </div>
                
                <div class="input-group">
                    <label for="body-input">Body (Optional):</label>
                    <textarea id="body-input" placeholder="Write your note content here..."></textarea>
                </div>
                
                <button type="submit" id="submit-btn">Create Note</button>
            </form>
        </section>

        <section class="notes-section">
            <div class="actions-bar">
                <h2>Your Notes</h2>
                <button id="load-btn">Load Notes</button>
            </div>
            
            <ul id="notes-list">
            </ul>
        </section>
    </main>
</body>
</html>
